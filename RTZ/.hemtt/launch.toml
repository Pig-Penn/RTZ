# `hemtt launch` presets. RTZ cannot run at all without CBA and ZEN (they are
# its requiredAddons), and LAMBS is loaded alongside it in every real session —
# rtz_control's reset, rtz_hud's danger labels and rtz_spotting all read LAMBS
# state — so the default preset carries all three.
[default]
mission = "test.Altis"
workshop = [
    "450814997",  # CBA_A3
    "1779063631", # Zeus Enhanced (ZEN)
    "2434257231", # LAMBS_Danger.fsm (DEV)
    "1858070328", # LAMBS RPG
    "1808238502", # LAMBS Suppression
    "1862208264", # LAMBS Turrets
    "642912021", # Zeus and Eden Compositions (ZEC)
    "623475643", # 3DEN Enhanced
    "1665585720", # Project Injury Reaction (PiR)
    "2993442344", # Death and Hit Reactions
    "3002800433", # PiR DHR Compatibility
]
dlc = [
    "Reaction Forces",
    "Western Sahara",
    "Expeditionary Forces",
]
