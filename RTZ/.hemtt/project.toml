name = "Real-Time Zeus"
prefix = "rtz"
author = "Maxim"
mainprefix = "x"

# Copied into every build alongside the PBOs. LICENSE is required here, not
# optional: GPL-3.0 §4 obliges a distributor to give recipients a copy of the
# license, and a release zip that ships only .pbo files would not.
[files]
include = [
    "LICENSE",
    "mod.cpp",
    "README.md",
]

[version]
git_hash = 0

# Pinned rather than left to HEMTT's default. Without an explicit authority HEMTT
# generates one per release, so every build signs under a DIFFERENT key name — on a
# server running verifySignatures = 2 that invalidates the previously whitelisted
# .bikey and locks clients out on every update. Fixing the authority means one key
# is valid for the life of the mod.
[signing]
authority = "rtz"
