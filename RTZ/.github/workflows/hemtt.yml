name: HEMTT

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Run hemtt check
        run: hemtt check

  release:
    name: Release Build
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Run hemtt release
        run: hemtt release
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtz-${{ github.ref_name }}
          path: releases/*.zip
