name: HEMTT

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Run hemtt check
        run: hemtt check
      # `check` validates syntax, macro expansion and stringtables but never packs
      # a PBO, so anything that only fails at pack time — a missing .paa, a file the
      # prefix cannot resolve — reached main unnoticed. Build on every push/PR.
      - name: Run hemtt build
        run: hemtt build

  release:
    name: Release Build
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required by the publish step below to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
      - name: Run hemtt release
        run: hemtt release
      # Published as a real GitHub Release, not an actions artifact: artifacts
      # expire (90 days by default) and are only reachable by people signed in
      # with repo access, which is not a usable distribution channel for a tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
